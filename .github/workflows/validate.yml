name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify checkout manifest and resource relationships
        run: python3 -I -B maintenance/package.py verify
      - name: Run offline regressions
        run: python3 -I -B -m unittest discover -s tests
      - name: Exercise reviewed export and reproducible archives
        shell: python
        run: |
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          def run(*args):
              return subprocess.check_output(args, text=True, timeout=60)

          commit = run("git", "rev-parse", "HEAD").strip()
          with tempfile.TemporaryDirectory(prefix="netstack-ci-") as directory:
              root = Path(directory).resolve()
              installed = root / "netstack"
              print(run(sys.executable, "-I", "-B", "maintenance/package.py", "export",
                        "--commit", commit, "--output", str(installed)))
              print(run(sys.executable, "-I", "-B", str(installed / "scripts/verify.py")))
              run(sys.executable, "-I", "-B", str(installed / "scripts/analytics.py"), "rfv", "--help")
              archives = [root / "first.zip", root / "second.zip"]
              for archive in archives:
                  print(run(sys.executable, "-I", "-B", "maintenance/package.py", "archive",
                            "--commit", commit, "--output", str(archive)))
              if archives[0].read_bytes() != archives[1].read_bytes():
                  raise SystemExit("Runtime archives differ for the same reviewed commit")
              print(json.dumps({"reviewed_commit": commit, "repeat_archive_bytes_match": True}))
